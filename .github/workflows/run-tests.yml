name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 10.*
            php: 8.2
            testbench: 8.36
            carbon: ^2.72
            pest: ^3.8
            pest_plugin_arch: ^3.1
          - laravel: 11.*
            php: 8.2
            testbench: 9.15
            carbon: ^2.72|^3.0
            pest: ^3.8
            pest_plugin_arch: ^3.1
          - laravel: 12.*
            php: 8.2
            testbench: 10.8
            carbon: ^2.72|^3.0
            pest: ^3.8
            pest_plugin_arch: ^3.1
          - laravel: 13.*
            php: 8.3
            testbench: 11.0
            carbon: ^3.8
            pest: ^4.0
            pest_plugin_arch: ^4.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-arch:${{ matrix.pest_plugin_arch }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci --no-coverage
